# Project: Umangly - AI-Powered Mental Wellness App
# Feature Module: Mood-Based Response System (Core + Intelligence)
# Framework: Flutter (Dart) + Firebase (Firestore, Analytics) + Google Vertex AI
# Purpose: Create a mood-tracking and emotional response system that personalizes user experience.

modules:
  - name: mood_selection_screen
    description: >
      Displays "How are you feeling today?" with options: Great, Good, OK, Low, Sad.
      On selection, triggers mood-based responses, saves data, and updates the UI theme dynamically.

    ui_elements:
      - mood_buttons: [😊 Great, 🙂 Good, 😐 OK, 😞 Low, 😢 Sad]
      - animation_area: Displays dynamic animation or illustration based on mood.
      - action_area: Shows suggested activity, quote, or journaling prompt.
      - background: Dynamically updates color scheme per mood.

    actions:
      - onMoodSelect(mood):
          steps:
            - Save {mood, timestamp, userId} to Firestore → collection: "moodHistory"
            - Trigger handleMoodResponse(mood)
            - Store today’s mood in SharedPreferences (avoid duplicate entries)
            - Update home screen UI theme dynamically

  - name: handle_mood_response
    description: >
      Central logic that defines what happens after user selects a specific mood.
    moods:
      - mood: "Great"
        type: "Positive Energy"
        actions:
          - Show confetti animation
          - Display quote: "Your energy is contagious!"
          - Open Gratitude Card → "What made you feel great today?"
          - Add a flower to “Mind Garden” widget
          - Option to share mood anonymously to “Global Mood Map”
          - Play upbeat sound (birds chirping)
      - mood: "Good"
        type: "Balanced"
        actions:
          - Show journaling prompt: "What’s one thing that made today good?"
          - Display “5-Minute Boost Meditation”
          - Update progress chart with “steady day”
          - Display affirmation: "I’m grateful for small joys."
      - mood: "OK"
        type: "Neutral"
        actions:
          - Ask: "What would make your day a bit better?"
          - Suggest breathing/stretching activity
          - Display “Mood Lift Cards” (AI-generated quotes)
          - If user has 3+ “OK” days → suggest exploring positivity
      - mood: "Low"
        type: "Mild Down"
        actions:
          - Display empathy message: "It’s okay to have low days — they pass."
          - Offer calming meditation or rain sounds
          - Display gentle rain animation
          - Offer journaling: "What’s weighing on you today?"
          - Enable “Release Box” (speak or type to vent, visualized as floating away)
          - Optional: Fetch nearby “calm places” via Google Places API
      - mood: "Sad"
        type: "Deep Emotional"
        actions:
          - Display comfort animation “You’re not alone.”
          - Offer self-compassion meditation audio
          - Launch AI Mood Mentor chat with Gemini API
          - Enable voice-note “Emotional Release Orb” (record → visualize as floating light)
          - If sadness persists >3 days → suggest mental health resources/helplines

  - name: dynamic_home_personalization
    description: >
      Changes home screen look and recommendations based on selected mood.
    rules:
      - Great: {background: "bright yellow", recommend: "Gratitude Journal"}
      - Good: {background: "sky blue", recommend: "Affirmation of the Day"}
      - OK: {background: "soft beige", recommend: "Breathing Session"}
      - Low: {background: "cool gray", recommend: "Calm Meditation"}
      - Sad: {background: "deep navy", recommend: "Compassion Talk"}

  - name: mood_analytics
    description: >
      Tracks user moods, generates insights, and visualizes mood patterns.
    data_flow:
      - Log each mood selection to Firestore (moodHistory)
      - Generate weekly summary → "This week you felt calm 4 days and low 2 days."
      - Show mood streaks and averages using charts_flutter
      - Use Firebase Analytics for user behavior
      - Display “Weekly Mood Summary Card” component

  - name: mood_prediction_ai
    description: >
      Predict future mood trends using Google Vertex AI (time + frequency model).
    functions:
      - analyzeMoodTrends(userId):
          input: last 30 days of moodHistory
          output: predicted mood trend (e.g., Calm Thursdays)
      - sendProactiveNotification():
          example: "Hey Rahul, Thursdays usually bring calm energy for you. Try a gratitude walk 🌿"

  - name: ai_chat_integration
    description: >
      AI-driven conversation system for Low/Sad moods.
    implementation:
      - Use Gemini API for mood-aware empathetic chat.
      - Auto-start conversation with personalized tone: “Hey Rahul, want to talk about your day?”
      - Store conversations under "moodConversations" collection.
      - Include “Need urgent help?” button with external helpline links.

dependencies:
  - firebase_core
  - cloud_firestore
  - shared_preferences
  - charts_flutter / fl_chart
  - google_places
  - vertex_ai
  - lottie
  - audioplayers
  - provider or riverpod
  - gemini_api (chat integration)

goals:
  - Create emotional interactivity with personality.
  - Build a dynamic and evolving home interface.
  - Log data to enable analytics and AI-based insights.
  - Offer real empathy, not just UI responses.
